<div class="heat-map-wrapper">
  <div class="heat-map" #mapContainer></div>

  @if (hasLegend()) {
    <div class="color-legend" [attr.aria-label]="'map.legendAria' | t">
      <span class="color-legend__title">{{ 'map.temperature' | t }}</span>
      <div class="color-legend__bar" [style.background]="legendGradient()"></div>
      <div class="color-legend__values">
        <span>{{ minTemp() | number: '1.1-1' }} °C</span>
        <span>{{ maxTemp() | number: '1.1-1' }} °C</span>
      </div>
      <div class="color-legend__labels">
        <span>{{ 'map.cooler' | t }}</span>
        <span>{{ 'map.warmer' | t }}</span>
      </div>
    </div>
  }
</div>
